<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dungeon of Fate v2.5</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100f0e;color:#eee;font-family:system-ui,sans-serif}
body{display:flex;justify-content:center;overscroll-behavior:none}
#game{width:min(680px,100vw);height:100dvh;padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px}
#hud{display:grid;grid-template-columns:1fr 1.15fr 1fr 1fr;gap:5px}.stat{background:#24211e;border:1px solid #514940;border-radius:9px;padding:3px;text-align:center}.label{font-size:7px;color:#9e9588;letter-spacing:1px;text-transform:uppercase}.value{font-size:15px;font-weight:900;line-height:19px;white-space:nowrap}
#message{height:30px;display:flex;align-items:center;justify-content:center;text-align:center;color:#d8bf86;font-size:12px;padding:0 10px}
#board{position:relative;flex:1;min-height:0;border:2px solid #4d463e;border-radius:15px;background:#181614;overflow:hidden;touch-action:manipulation}
.cell{position:absolute;width:7.2%;height:7.2%;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer;touch-action:manipulation;transition:opacity .18s,filter .18s,transform .12s}.cell:active{transform:scale(.94)}
.floor{position:absolute;inset:1px;background:#413b35;border:2px solid #655b51;border-radius:6px;box-shadow:inset 0 2px #ffffff0a,inset 0 -3px #0006,0 2px 3px #0008}
.cell.available .floor{border-color:#c19a58;box-shadow:0 0 14px #b8945844}.cell.current .floor{border-color:#e0bb69;box-shadow:0 0 20px #d2a65377}.cell.searched .floor{background:#35302b;border-color:#575049}
.cell.treasure .floor{background:linear-gradient(#55472f,#3c3328);border-color:#b99752}.cell.rich .floor{background:linear-gradient(#4c3d51,#352e38);border-color:#a88cc3}.cell.monster .floor{background:linear-gradient(#4d302e,#382726);border-color:#a86158}.cell.trap .floor{background:linear-gradient(#4e392a,#382c24);border-color:#b77b4b}.cell.heal .floor{background:linear-gradient(#34483a,#29372e);border-color:#72a67c}.cell.key .floor{background:linear-gradient(#30404b,#29343a);border-color:#709ab0}
.icon{position:relative;z-index:5;font-size:16px;font-weight:900;text-shadow:0 2px 3px #000;pointer-events:none}.unknown .icon{font-size:14px;color:#b7ad9f}.event{position:absolute;right:1px;bottom:0;z-index:6;font-size:12px;pointer-events:none}
.startMark,.exitMark{position:absolute;left:2px;z-index:6;font-size:6px;pointer-events:none}.startMark{top:0;color:#aaa093}.exitMark{bottom:0;color:#cdb36f}
.link{position:absolute;background:#70655a;z-index:1;border-radius:4px;box-shadow:0 1px 3px #000;pointer-events:none}.link.recent{background:#aa8d5c}.link.old{opacity:.46}.link.veryold{opacity:.24}
#hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);color:#70675d;font-size:9px;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.panel{width:min(420px,100%);background:#29241f;border:2px solid #6c5940;border-radius:17px;padding:24px;text-align:center}.panel h1{margin:0 0 8px}.panel p{color:#c0b5a6;font-size:13px}.big{font-size:42px;font-weight:950;margin:10px}.panel button{min-height:45px;border:1px solid #6d5a3f;background:#76572c;color:#fff;border-radius:10px;font-size:11px;font-weight:900;padding:0 20px}
</style></head><body>
<div id="game"><div id="hud"><div class="stat"><div class="label">Health</div><div class="value" id="hp"></div></div><div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">Floor</div><div class="value" id="floorNo">1</div></div><div class="stat"><div class="label">Combo</div><div class="value" id="combo">x1.0</div></div></div><div id="message"></div><div id="board"></div></div>
<div id="overlay"><div class="panel"><h1 id="endTitle"></h1><p id="endText"></p><div class="big" id="finalScore"></div><p id="finalStats"></p><button id="again">NEW RUN</button></div></div>
<script>
(function(){
"use strict";
var W=9,H=9,N=W*H,rooms=[],startId=0,exitId=0,currentId=0,history=[],searched={},hp=3,score=0,combo=1,floorNo=1,gameOver=false,totalMoves=0;
function $(id){return document.getElementById(id)} function room(id){return rooms[id]}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function adjacent(r){var a=[];if(r.x>0)a.push(rooms[r.id-1]);if(r.x<W-1)a.push(rooms[r.id+1]);if(r.y>0)a.push(rooms[r.id-W]);if(r.y<H-1)a.push(rooms[r.id+W]);return a}
function generateDungeon(){
 rooms=[];for(var i=0;i<N;i++)rooms.push({id:i,x:i%W,y:Math.floor(i/W),active:false,links:[],known:false,visited:false,searched:false,event:"empty"});
 var target=27+Math.floor(Math.random()*9),root=Math.floor(Math.random()*N),active=[root];room(root).active=true;
 while(active.length<target){var candidates=[];for(i=0;i<active.length;i++)adjacent(room(active[i])).forEach(function(n){if(!n.active&&candidates.indexOf(n.id)<0)candidates.push(n.id)});if(!candidates.length)break;var pick=candidates[Math.floor(Math.random()*candidates.length)];room(pick).active=true;active.push(pick)}
 var connected={},frontier=[root];connected[root]=true;
 while(frontier.length){var fi=Math.floor(Math.random()*frontier.length),from=room(frontier[fi]),opts=adjacent(from).filter(function(n){return n.active&&!connected[n.id]});if(!opts.length){frontier.splice(fi,1);continue}var to=opts[Math.floor(Math.random()*opts.length)];from.links.push(to.id);to.links.push(from.id);connected[to.id]=true;frontier.push(to.id)}
 var possible=[];for(i=0;i<N;i++){var rr=room(i);if(!rr.active)continue;adjacent(rr).forEach(function(n){if(n.active&&n.id>rr.id&&rr.links.indexOf(n.id)<0)possible.push([rr,n])})}shuffle(possible);for(i=0;i<Math.floor(target*.12)&&i<possible.length;i++){possible[i][0].links.push(possible[i][1].id);possible[i][1].links.push(possible[i][0].id)}
 chooseEndpoints();placeEvents()
}
function chooseEndpoints(){var d=[],q=[],i;do{startId=Math.floor(Math.random()*N)}while(!room(startId).active);for(i=0;i<N;i++)d[i]=-1;d[startId]=0;q.push(startId);for(i=0;i<q.length;i++)room(q[i]).links.forEach(function(id){if(d[id]<0){d[id]=d[q[i]]+1;q.push(id)}});var far=[];for(i=0;i<N;i++)if(room(i).active&&i!==startId)far.push(i);far.sort(function(a,b){return d[b]-d[a]});exitId=far[Math.floor(Math.random()*Math.min(5,far.length))]}
function placeEvents(){var ids=[],events=["treasure","treasure","treasure","treasure","rich","monster","monster","trap","trap","heal","key"];for(var i=0;i<N;i++)if(room(i).active&&i!==startId&&i!==exitId)ids.push(i);shuffle(ids);for(i=0;i<events.length&&i<ids.length;i++)room(ids[i]).event=events[i]}
function revealNeighbors(id){room(id).links.forEach(function(n){room(n).known=true})}
function knownDistance(id){if(id===currentId)return 0;var dist={},q=[currentId];dist[currentId]=0;for(var k=0;k<q.length;k++)room(q[k]).links.forEach(function(n){if(!room(n).known||dist[n]!==undefined)return;dist[n]=dist[room(q[k]).id]+1;q.push(n)});return dist[id]===undefined?6:dist[id]}
function routeDistance(id){var best=999;for(var i=0;i<history.length;i++)if(history[i]===id)best=Math.min(best,history.length-1-i);return best<999?best:knownDistance(id)}
function beginRun(){hp=3;score=0;combo=1;floorNo=1;gameOver=false;history=[];searched={};totalMoves=0;$("overlay").style.display="none";newFloor(true)}
function newFloor(first) {
    generateDungeon();

    currentId = startId;
    history = [startId];

    room(startId).known = true;
    room(startId).visited = true;

    // The player begins by searching the room they're already in.
    room(startId).searched = true;
    searched[startId] = true;
    revealNeighbors(startId);

    $("message").textContent = first
        ? "Choose a revealed room."
        : "You descend deeper. The dungeon grows more dangerous.";

    update();
}
function enterRoom(id){if(gameOver||id===currentId)return;var cur=room(currentId);if(cur.links.indexOf(id)<0)return;currentId=id;room(id).known=true;room(id).visited=true;history.push(id);totalMoves++;if(room(id).searched){$("message").textContent="Already searched. Choose another revealed room.";update();return}searchCurrentRoom()}
function searchCurrentRoom(){var r=room(currentId);r.searched=true;searched[currentId]=true;if(currentId===exitId){var exitBonus=300+floorNo*80;score+=Math.floor(exitBonus*combo);$("message").textContent="Exit found! Descending... +"+Math.floor(exitBonus*combo);update();setTimeout(function(){floorNo++;combo=Math.min(6,combo+.25);newFloor(false)},500);return}var gain;switch(r.event){case"treasure":gain=180*Math.round(combo)*(1+Math.floor((floorNo-1)/5)*.1);score+=Math.floor(gain);combo=Math.min(5,combo+.35);$("message").textContent="Treasure! +"+Math.floor(gain)+" score.";break;case"rich":gain=600*Math.round(combo)*(1+Math.floor((floorNo-1)/5)*.15);score+=Math.floor(gain);combo=Math.min(6,combo+.6);$("message").textContent="Rare treasure! +"+Math.floor(gain)+" score.";break;case"monster":hp--;combo=1;$("message").textContent="Monster ambush! -1 ❤️";break;case"trap":hp--;combo=1;$("message").textContent="Trap! -1 ❤️";break;case"heal":hp=Math.min(3,hp+1);score+=100+floorNo*10;$("message").textContent="Ancient shrine! +1 ❤️";break;case"key":score+=250+floorNo*20;combo=Math.min(5,combo+.5);$("message").textContent="Ancient key! +"+(250+floorNo*20)+" score.";break;default:gain=Math.floor(35*combo*(1+floorNo*.04));score+=gain;$("message").textContent="Empty room. +"+gain+" score."}if(hp<=0){finish("The dungeon defeated you.");return}revealNeighbors(currentId);update()}
function addLink(a,b){var e=document.createElement("div");e.className="link";var d=Math.min(routeDistance(a.id),routeDistance(b.id));if(d<=1)e.className+=" recent";else if(d>=4)e.className+=" veryold";else if(d>=3)e.className+=" old";var size=7.2,ax=a.x/W*100+1.7+size/2,ay=a.y/H*100+1.7+size/2,bx=b.x/W*100+1.7+size/2,by=b.y/H*100+1.7+size/2;if(a.y===b.y){e.style.left=(Math.min(ax,bx)+size/2)+"%";e.style.top=(ay-.55)+"%";e.style.width=Math.max(.2,Math.abs(ax-bx)-size)+"%";e.style.height="1.1%"}else{e.style.left=(ax-.55)+"%";e.style.top=(Math.min(ay,by)+size/2)+"%";e.style.width="1.1%";e.style.height=Math.max(.2,Math.abs(ay-by)-size)+"%"}$("board").appendChild(e)}
function render(){var board=$("board");board.innerHTML="";for(var i=0;i<N;i++){var r=room(i);if(!r.active||!r.known)continue;for(var j=0;j<r.links.length;j++){var n=room(r.links[j]);if(n.known&&n.id>r.id)addLink(r,n)}}for(i=0;i<N;i++){r=room(i);if(!r.active||!r.known)continue;var cell=document.createElement("div"),d=routeDistance(r.id);cell.className="cell";if(r.id===currentId)cell.className+=" current";if(!r.searched)cell.className+=" unknown";if(r.searched)cell.className+=" searched";if(r.searched&&r.event!=="empty")cell.className+=" "+r.event;if(r.id!==currentId&&room(currentId).links.indexOf(r.id)>=0)cell.className+=" available";cell.style.left=(r.x/W*100+1.7)+"%";cell.style.top=(r.y/H*100+1.7)+"%";cell.style.opacity=Math.max(.30,1-d*.14);cell.style.filter="saturate("+Math.max(.48,1-d*.10)+")";var floor=document.createElement("div");floor.className="floor";cell.appendChild(floor);var icon=document.createElement("div");icon.className="icon";icon.textContent=r.id===currentId?"◆":r.searched?"·":"?";cell.appendChild(icon);if(r.id===startId&&r.searched){var sm=document.createElement("div");sm.className="startMark";sm.textContent="START";cell.appendChild(sm)}if(r.id===exitId&&r.searched){var xm=document.createElement("div");xm.className="exitMark";xm.textContent="EXIT";cell.appendChild(xm)}if(r.searched&&r.event!=="empty"){var ev=document.createElement("div");ev.className="event";ev.textContent={treasure:"🪙",rich:"💎",monster:"👹",trap:"⚠️",heal:"✚",key:"🗝"}[r.event]||"";cell.appendChild(ev)}(function(id){cell.addEventListener("pointerup",function(e){e.preventDefault();if(e.pointerType==="mouse"&&e.button!==0)return;enterRoom(id)},{passive:false})})(r.id);board.appendChild(cell)}var hint=document.createElement("div");hint.id="hint";hint.textContent="Tap a gold-bordered room to enter";board.appendChild(hint)}
function update(){$("hp").textContent="❤️".repeat(hp)+"🖤".repeat(3-hp);$("score").textContent=Math.floor(score).toLocaleString();$("floorNo").textContent=floorNo;$("combo").textContent="x"+combo.toFixed(1);render()}
function finish(title){gameOver=true;$("endTitle").textContent=title;$("endText").textContent="Every floor was random. Every move was your decision.";$("finalScore").textContent=Math.floor(score).toLocaleString();$("finalStats").textContent="Reached floor "+floorNo+" • "+totalMoves+" moves • "+Object.keys(searched).length+" rooms revealed";$("overlay").style.display="flex"}
$("again").addEventListener("pointerup",function(e){e.preventDefault();beginRun()},{passive:false});beginRun();
})();
</script></body></html>
